version: "3.9"

services:
  user-service:
    build:
      context: ./Microservices/user-service
    ports:
      - "3000:3000"
    networks:
      - app-network

  product-service:
    build:
      context: ./Microservices/product-service
    ports:
      - "3001:3001"
    networks:
      - app-network

  order-service:
    build:
      context: ./Microservices/order-service
    ports:
      - "3002:3002"
    networks:
      - app-network
    

  gateway-service:
    build:
      context: ./Microservices/gateway-service
    ports:
      - "3003:3003"
    networks:
      - app-network
    depends_on:
      - user-service
      - product-service
      - order-service

networks:
  app-network:
    driver: bridge